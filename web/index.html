 </style></head><body><header><strong>ergoers<span style="color:#add6bd"> road map</span></strong><nav><button onclick="view='learn';render()">Learning path</button><button onclick="view='library';render()">Course content</button><button onclick="view='costing';render()">Product costing</button><button onclick="view='progress';render()">Progress</button><button onclick="view='edit';render()">Content studio</button><a class="agent-link" href="https://ergo-agent.vercel.app/#product-cost-calculator" target="_blank" rel="noopener noreferrer">Ergo Agent ↗</a></nav></header><main><div class="row"><span class="pill">ENGLISH · TRAINING PILOT</span><span class="muted">Learn. Apply. Remember.</span></div><div id="notice" role="status" aria-live="polite"></div><div id="app"></div></main><footer>Ergoers learning pathway · 70% to pass · Retest after six months</footer><script src="costing-content.js"></script><script src="product-costing-tool.js"></script><script src="operation-content.js"></script><script src="operation-lean.js"></script><script src="culture-content.js"></script><script src="market-content.js"></script><script src="pm-content.js"></script><script src="product-content.js"></script><script src="assessment-bank.js"></script><script src="learning-visual.js"></script><script src="academy-assessment.js"></script><script>
const modules=[{title:'Corporate Culture',file:'Ergovn training - Corporate Culture R05.pptx',description:'Understand the culture and put it into everyday practice.'},{title:'Operation Process',file:'Ergovn Sales Process- Phuc Ngo.docx',description:'Coordinate sales, supply chain and project delivery.'},{title:'General Market',file:'Ergo Training - General Market Info.pptx',description:'Understand the market and the customers we serve.'},{title:'Costing',file:'Ergovn training - Costing Rev02.pptx',description:'Apply costing knowledge to informed decisions.'},{title:'Product Training',file:'Ergovn.com and official maker product pages',description:'Learn product features, specifications and applications.'},{title:'Project Management',file:'Ergovn Sales Process- Phuc Ngo.docx',description:'Coordinate technical support and safe project delivery.'}];
const key='ergo-academy-v1';let state={people:[],content:modules.map(()=>({lesson:'',questions:[]})),active:''},view='learn';try{const saved=JSON.parse(localStorage.getItem(key));if(saved)state=saved}catch{}if(!state.content[3].lesson.trim()&&!state.content[3].questions.length)state.content[3]=JSON.parse(JSON.stringify(costingContent));if(state.operationVersion!==1){state.archivedEmail={content:state.content[1],attempts:state.people.flatMap(p=>p.attempts.filter(a=>a.module===1).map(a=>({...a,learnerId:p.id})))};state.people.forEach(p=>p.attempts=p.attempts.filter(a=>a.module!==1));state.content[1]=JSON.parse(JSON.stringify(operationContent));state.operationVersion=1;try{localStorage.setItem(key,JSON.stringify(state))}catch{}}while(state.content.length<modules.length)state.content.push({lesson:'',questions:[]});if(state.content[1].lesson===operationContent.previousLesson&&JSON.stringify(state.content[1].questions)===operationContent.previousQuestions)state.content[1]=JSON.parse(JSON.stringify({lesson:operationContent.lesson,questions:operationContent.questions}));for(const [i,c] of [[0,cultureContent],[2,marketContent],[4,productContent],[5,pmContent]])if(!state.content[i].lesson.trim()&&!state.content[i].questions.length)state.content[i]=JSON.parse(JSON.stringify(c));if(state.content[4].lesson===productContent.previousLesson&&JSON.stringify(state.content[4].questions)===productContent.previousQuestions)state.content[4]=JSON.parse(JSON.stringify({lesson:productContent.lesson,questions:productContent.questions}));assessmentCourses.forEach((c,i)=>{const old=JSON.stringify(state.content[i].questions);if(old===c.priorQuestions||(i===1&&old===JSON.stringify(operationContent.questions.slice(0,15)))||(i===4&&old===productContent.previousQuestions)){state.content[i].questions=JSON.parse(JSON.stringify(c.questions));state.content[i].lesson=c.lesson}});const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('Storage failed. Export a backup before closing this page.')}}function person(){return state.people.find(p=>p.id===state.active)}function first(p,i){return p?.attempts.find(a=>a.module===i&&a.type==='initial'&&a.score>=(a.passScore??80))}
function due(iso){const d=new Date(iso),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+6);const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,last));return d}
function complete(p,i){const f=first(p,i);return !!f&&p.attempts.some(a=>a.module===i&&a.type==='retest'&&a.score>=(a.passScore??80)&&new Date(a.at)>=due(f.at))}function prerequisite(i){return i>=4?3:i-1}function unlocked(p,i){return !!p}function status(p,i){if(complete(p,i))return '100% complete';const f=first(p,i);if(f)return new Date()>=due(f.at)?'Retest due':'Initial test passed';return !unlocked(p,i)?'Locked':p?.learningCompleted?.[i]?'Learning complete · Test ready':'Ready to learn'}function ready(i){const c=state.content[i];return c.lesson.trim()&&c.questions.length>=30}function date(d){return new Date(d).toLocaleDateString('en-GB',{timeZone:'Asia/Ho_Chi_Minh',day:'numeric',month:'short',year:'numeric'})}
function profiles(){return `<div class="row"><label>Learner <select onchange="state.active=this.value;save();render()"><option value="">Choose a learner</option>${state.people.map(p=>`<option value="${esc(p.id)}" ${p.id===state.active?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><button class="secondary" onclick="addPerson()">Add learner</button></div>`}function addPerson(){let d=document.getElementById('learnerDialog');if(!d){d=document.createElement('dialog');d.id='learnerDialog';d.style.cssText='border:1px solid #b5c7c1;border-radius:14px;padding:24px;max-width:420px;width:90%';d.innerHTML=`<form id="learnerForm"><h2>Add learner</h2><label>Full name<input id="learnerName" name="learnerName" required maxlength="100" style="display:block;width:100%" autocomplete="name"></label><div class="row"><button type="submit">Create learner</button><button type="button" class="secondary" onclick="document.getElementById('learnerDialog').close()">Cancel</button></div></form>`;document.body.appendChild(d);document.getElementById('learnerForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('learnerName').value.trim();if(!name)return;const p={id:crypto.randomUUID(),name,attempts:[]};state.people.push(p);state.active=p.id;save();d.close();render()}}document.getElementById('learnerName').value='';d.showModal();document.getElementById('learnerName').focus()}

function render(){document.getElementById('notice').textContent='';if(view==='edit')return editor();if(view==='progress')return academyProgress();if(view==='library')return library();if(view==='costing')return costingToolPage();return learningDashboard()}
function costingToolPage(){app.innerHTML=`<button class="secondary costing-page-back" onclick="view='library';render()">← Course content</button><h1>Product costing</h1><p class="muted costing-page-intro">Estimate landed cost and target selling price for one product or a complete project package. Confirm live freight, tax and import assumptions before a bid.</p>${productCostingTool()}`}
function lessonBody(i){const template=i===3?productCostingTool()+`<section class="card"><h2>Your daily costing workbook</h2><p><a href="Costing-Daily-Template-Rev00.xlsx" download="(Ergo-xxx) Costing Pxxx-E Rev00.xlsx">Download Costing template · Excel · Rev00</a></p><p class="muted">Original workbook, unchanged. Save a separate copy for each project. Check rates, discounts, quantities and formulas before relying on totals.</p><p class="error">Known source issues: General!E10 and HAD!AM14 contain broken references. Repair and verify affected totals before using them for a quotation.</p></section>`:'';return template+(i===1&&state.content[i].lesson===operationContent.lesson?operationVisual():i===4&&state.content[i].lesson===productContent.lesson?productVisual():courseVisual(i))}function library(){app.innerHTML=`<h1>Course content</h1><p class="muted">Browse lessons before starting the assessments. Study any course. Click Finished after learning. Finish any 4 of 6 courses to unlock the academy test.</p><div class="grid">${modules.map((m,i)=>`<article class="card"><h2>${m.title}</h2><p>${ready(i)?('20 random questions · '+state.content[i].questions.length+' in bank'):'Awaiting source deck'}</p><button class="secondary" ${ready(i)?'':'disabled'} onclick="readContent(${i})">Read lesson</button></article>`).join('')}</div>`}function readContent(i){if(!ready(i))return;app.innerHTML=`<button class="secondary" onclick="view='library';render()">← Course content</button><h1>${modules[i].title}</h1>${lessonBody(i)}<p class="muted">Finish any 4 courses to unlock one academy test: 20 random questions, 70% to pass.</p>`}function lesson(i){if(!person()||!ready(i))return;person().learningViewed??={};person().learningViewed[i]=new Date().toISOString();save();app.innerHTML=`<button class="secondary" onclick="render()">← Learning path</button><h1>${modules[i].title}</h1>${lessonBody(i)}<section class="card"><h2>Finished learning?</h2><p>Click Finished to record completion of this course.</p><button ${person().learningCompleted?.[i]?'disabled':''} onclick="finishLearning(${i})">${person().learningCompleted?.[i]?'Finished ✓':'Finished'}</button></section>`}

function finishLearning(i){const p=person();if(!p||!ready(i)||!unlocked(p,i)||!p.learningViewed?.[i])return;p.learningCompleted??={};p.learningCompleted[i]=new Date().toISOString();save();render()}function pickTestQuestions(bank){const copy=bank.slice();for(let n=copy.length-1;n>0;n--){const k=Math.floor(Math.random()*(n+1));[copy[n],copy[k]]=[copy[k],copy[n]]}return copy.slice(0,20)}function test(i,type){const p=person(),f=first(p,i);if(!p||!ready(i)||!unlocked(p,i)||(type==='initial'&&(f||!p.learningCompleted?.[i]))||(type==='retest'&&(!f||new Date()<due(f.at)||complete(p,i))))return;const qs=pickTestQuestions(state.content[i].questions);app.innerHTML=`<button class="secondary" onclick="render()">← Back</button><h1>${modules[i].title}: ${type==='retest'?'six-month retest':'initial test'}</h1><p>20 random questions. Answer all 30. At least 14 correct (70%) passes.</p><form id="quiz">${qs.map((q,n)=>`<fieldset><legend>${n+1}. ${esc(q.prompt)}</legend>${q.options.map((o,k)=>`<label><input type="radio" name="q${n}" value="${k}" required> ${esc(o)}</label>`).join('')}</fieldset>`).join('')}<button>Submit assessment</button></form>`;document.getElementById('quiz').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target);const answers=qs.map((q,n)=>Number(data.get('q'+n))),correct=qs.filter((q,n)=>q.answer===answers[n]).length,score=correct/qs.length*100;p.attempts.push({module:i,type,at:new Date().toISOString(),score,passScore:70,questionCount:30,answers,questions:structuredClone(qs)});save();app.innerHTML=`<h1>${score>=70?'Assessment passed':'Review and try again'}</h1><div class="hero"><div><div class="stat">${score.toFixed(1)}%</div><p>${correct} of ${qs.length} correct</p></div><div><h2>${score>=70?(type==='initial'?'Initial pass recorded':'Module 100% complete'):'More practice needed'}</h2><p>${score>=70&&type==='initial'?'Retest due '+date(due(first(p,i).at)):'Review the feedback below.'}</p></div></div>${qs.map((q,n)=>`<div class="card" style="margin-top:12px"><b>${n+1}. ${esc(q.prompt)}</b><p>${q.answer===answers[n]?'Correct':'Incorrect'} · Correct answer: ${esc(q.options[q.answer])}</p><p class="muted">${esc(q.explanation)}</p></div>`).join('')}<p><button onclick="render()">Return to learning path</button></p>`}}
function progressView(){app.innerHTML=`<h1>Progress overview</h1><p class="muted">Local pilot records · initial passes and six-month retests</p><div class="banner">This is a browser-local pilot, not a shared HR database or a secure examination system. Content studio and learner records are accessible to anyone with access to this private pilot.</div><div class="row"><button onclick="backup()">Export backup</button><label>Restore backup <input type="file" accept="application/json" onchange="restore(this.files[0])"></label></div><div class="card scroll"><table><thead><tr><th>Learner</th>${modules.map(m=>`<th>${m.title}</th>`).join('')}<th>Completion</th></tr></thead><tbody>${state.people.map(p=>`<tr><td>${esc(p.name)}</td>${modules.map((m,i)=>`<td>${status(p,i)}${first(p,i)?'<small>Retest: '+date(due(first(p,i).at))+'</small>':''}</td>`).join('')}<td>${modules.filter((m,i)=>complete(p,i)).length}/${modules.length}</td></tr>`).join('')||'<tr><td colspan="8">No learners yet. Add a learner on the learning path.</td></tr>'}</tbody></table></div>${profiles()}${person()?`<h2>Attempt history</h2><div class="card scroll"><table><tr><th>Module</th><th>Assessment</th><th>Date</th><th>Score</th></tr>${person().attempts.map(a=>`<tr><td>${modules[a.module].title}</td><td>${esc(a.type)}</td><td>${date(a.at)}</td><td>${a.score.toFixed(1)}% · ${a.score>=(a.passScore??80)?'Passed':'Failed'}</td></tr>`).join('')||'<tr><td colspan="4">No attempts yet.</td></tr>'}</table></div>`:''}`}
function editor(){app.innerHTML=`<h1>Content studio</h1><p class="muted">Prepare verified lessons and assessments from your four source decks.</p><div class="banner">Five modules use the supplied documents. Product Training uses Ergovn.com and official maker pages. Edits here are saved only in your browser. Review historical or conflicting rates before using them in live costing. The editor accepts lesson text and a JSON question bank; it does not import PowerPoint files.</div><label>Module <select id="module" onchange="fillEditor()">${modules.map((m,i)=>`<option value="${i}">${i+1}. ${m.title}</option>`).join('')}</select></label><p id="source" class="muted"></p><label>Lesson text<textarea id="lesson" placeholder="Paste verified English lesson content here"></textarea></label><label>Question bank (JSON array)<textarea id="bank" spellcheck="false"></textarea></label><p class="muted">At least 30 questions. Each requires a prompt, 2–6 options, an answer index starting at 0, and feedback. Changing a published question bank affects future attempts only.</p><details><summary>Question format</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify([{prompt:'Replace with a source-based question',options:['Option A','Option B'],answer:0,explanation:'Explain the correct answer using the deck.'}],null,2))}</pre></details><p><button onclick="saveContent()">Save lesson and questions</button></p>`;fillEditor()}
function fillEditor(){const i=Number(document.getElementById('module').value);document.getElementById('source').textContent='Source: '+modules[i].file;document.getElementById('lesson').value=state.content[i].lesson;document.getElementById('bank').value=JSON.stringify(state.content[i].questions,null,2)}function validQuestions(qs){return Array.isArray(qs)&&qs.every(q=>q&&typeof q.prompt==='string'&&q.prompt.trim()&&Array.isArray(q.options)&&q.options.length>=2&&q.options.length<=6&&q.options.every(o=>typeof o==='string'&&o.trim())&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length&&typeof q.explanation==='string'&&q.explanation.trim())}function saveContent(){try{const i=Number(document.getElementById('module').value),qs=JSON.parse(document.getElementById('bank').value);if(!validQuestions(qs))throw Error('Use valid questions with options, an answer index, and feedback.');state.content[i]={lesson:document.getElementById('lesson').value,questions:qs};save();document.getElementById('notice').textContent=ready(i)?'Module saved and ready for learning.':'Draft saved. Add lesson text and at least thirty questions to enable assessment.'}catch(e){alert(e.message)}}
function backup(){const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,state},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ergo-academy-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restore(file){if(!file)return;try{const b=JSON.parse(await file.text()),s=b.state;if(b.version!==1||!s||!Array.isArray(s.people)||!Array.isArray(s.content)||s.content.length!==modules.length||!s.content.every(c=>typeof c.lesson==='string'&&validQuestions(c.questions))||!s.people.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&Array.isArray(p.attempts)&&p.attempts.every(a=>Number.isInteger(a.module)&&a.module>=0&&a.module<modules.length&&['initial','retest'].includes(a.type)&&Number.isFinite(a.score)&&a.score>=0&&a.score<=100&&!isNaN(new Date(a.at)))))throw Error('Invalid backup format');if(!confirm('Replace all local learners, lessons, and assessment records with this backup?'))return;if(s.operationVersion!==1)throw Error('This backup uses the retired Email module. Keep it as an archive; restore an Operation Process backup instead.');state=s;save();render()}catch(e){alert('Could not restore: '+e.message)}}render();
</script></body></html>
